name: .NET Tests
on:
  push:
    branches: [ "main" ]
    paths:
      - 'global.json'
      - '**.cs'
      - '**.axaml'
      - '**.xaml'
      - '.gitattributes'
      - 'src/ExternalLibraries.Avalonia.DataGrid/**'
      - 'scripts/verify-datagrid-*.ps1'
      - 'scripts/verify-unigetui-nativeaot.ps1'
      - '**.csproj'
      - '**.props'
      - '**.targets'
      - '**.sln'
      - '**.slnx'
      - 'src/.editorconfig'
      - '.github/workflows/dotnet-test.yml'

  pull_request:
    branches: [ "main" ]
    paths:
      - 'global.json'
      - '**.cs'
      - '**.axaml'
      - '**.xaml'
      - '.gitattributes'
      - 'src/ExternalLibraries.Avalonia.DataGrid/**'
      - 'scripts/verify-datagrid-*.ps1'
      - 'scripts/verify-unigetui-nativeaot.ps1'
      - '**.csproj'
      - '**.props'
      - '**.targets'
      - '**.sln'
      - '**.slnx'
      - 'src/.editorconfig'
      - '.github/workflows/dotnet-test.yml'

  workflow_dispatch:

jobs:
  test-codebase:
    runs-on: windows-latest
    env:
      NUGET_PACKAGES: ${{ github.workspace }}\.nuget\packages

    steps:
    - name: Checkout the repository
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Install .NET SDK
      uses: actions/setup-dotnet@v6
      with:
        global-json-file: global.json

    - name: Cache NuGet packages
      uses: actions/cache@v6
      with:
        path: ${{ env.NUGET_PACKAGES }}
        key: ${{ runner.os }}-nuget-${{ hashFiles('global.json', 'src/**/*.csproj', 'src/**/*.props', 'src/**/*.targets', 'src/**/*.sln', 'src/**/*.slnx') }}
        restore-keys: |
          ${{ runner.os }}-nuget-

    - name: Install dependencies
      working-directory: src
      run: dotnet restore UniGetUI.Windows.slnx

    - name: Verify maintained DataGrid provenance and production comparer fixtures
      shell: pwsh
      run: |
        ./scripts/verify-datagrid-provenance.ps1
        ./scripts/verify-datagrid-production-extracts.ps1 -RepositoryRoot . -FixtureRoot src/UniGetUI.Avalonia.DataGrid.NativeAotTests/Ui

    - name: Check whitespace formatting
      run: dotnet format whitespace src --folder --verify-no-changes --verbosity minimal --exclude ExternalLibraries.Avalonia.DataGrid/

    - name: Check code style formatting (Avalonia Windows solution)
      working-directory: src
      run: dotnet format style UniGetUI.Windows.slnx --no-restore --verify-no-changes --verbosity minimal --exclude ExternalLibraries.Avalonia.DataGrid/

    - name: Build Avalonia Windows solution
      working-directory: src
      run: |
        dotnet build-server shutdown
        dotnet build UniGetUI.Windows.slnx --no-restore --verbosity minimal /p:Platform=x64 /p:UseSharedCompilation=false /m:1

    - name: Run Tests
      working-directory: src
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: dotnet test UniGetUI.Windows.slnx --no-restore --verbosity q --nologo /p:Platform=x64 /p:UseSharedCompilation=false /m:1

    - name: Report full-trim publish warnings
      working-directory: src
      shell: pwsh
      continue-on-error: true
      run: |
        dotnet build-server shutdown
        dotnet publish UniGetUI.Avalonia/UniGetUI.Avalonia.csproj `
          --no-restore `
          --configuration Release `
          --runtime win-x64 `
          --self-contained true `
          --output "${{ runner.temp }}\unigetui-full-trim-publish" `
          /p:Platform=x64 `
          /p:PublishAot=false `
          /p:TrimMode=full `
          /p:TrimmerSingleWarn=false `
          /p:UseSharedCompilation=false `
          --verbosity minimal

    - name: Verify NativeAOT application artifact
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        $evidence = "${{ runner.temp }}/unigetui-native-validation/app"
        if (Test-Path -LiteralPath $evidence) { throw 'Native evidence directory must be fresh.' }
        New-Item -ItemType Directory -Path $evidence | Out-Null
        dotnet restore src/UniGetUI.Avalonia/UniGetUI.Avalonia.csproj `
          --runtime win-x64 /p:Configuration=Release /p:Platform=x64 /p:PublishProfile=Win-x64-NativeAot /p:PublishAot=true /p:SelfContained=true `
          2>&1 | Tee-Object -FilePath "$evidence/restore.log"
        if ($LASTEXITCODE -ne 0) { throw 'NativeAOT application restore failed.' }
        dotnet publish src/UniGetUI.Avalonia/UniGetUI.Avalonia.csproj `
          --no-restore --configuration Release --runtime win-x64 --self-contained true `
          --output "$evidence/native" /m:1 /p:Platform=x64 /p:PublishProfile=Win-x64-NativeAot `
          /p:ILLinkTreatWarningsAsErrors=true /p:IlcTreatWarningsAsErrors=true `
          /p:TrimmerSingleWarn=false /p:UseSharedCompilation=false --verbosity minimal `
          2>&1 | Tee-Object -FilePath "$evidence/publish.log"
        if ($LASTEXITCODE -ne 0) { throw 'NativeAOT application publish failed.' }
        dotnet msbuild src/UniGetUI.Avalonia/UniGetUI.Avalonia.csproj `
          -p:Configuration=Release -p:RuntimeIdentifier=win-x64 -p:Platform=x64 `
          -p:PublishProfile=Win-x64-NativeAot -p:PublishAot=true -p:SelfContained=true `
          -getProperty:PublishAot,NativeCompilationDuringPublish,NativeBinary,NativeObject,NativeIntermediateOutputPath,TargetName,MSBuildProjectDirectory `
          -nologo > "$evidence/native-properties.json"
        if ($LASTEXITCODE -ne 0) { throw 'NativeAOT build metadata evaluation failed.' }
        ./scripts/verify-unigetui-nativeaot.ps1 -OutputDirectory "$evidence/native" -PublishLog "$evidence/publish.log" -NativePropertiesPath "$evidence/native-properties.json"

    - name: Run DataGrid JIT and NativeAOT acceptance
      shell: pwsh
      run: ./scripts/verify-datagrid-aot.ps1 -OutputDirectory "${{ runner.temp }}/unigetui-native-validation/datagrid" -RuntimeIdentifier win-x64

    - name: Retain NativeAOT validation evidence
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: nativeaot-validation-${{ github.run_id }}-${{ github.run_attempt }}
        path: |
          ${{ runner.temp }}/unigetui-native-validation/**/*.log
          ${{ runner.temp }}/unigetui-native-validation/**/*.json
        if-no-files-found: warn
